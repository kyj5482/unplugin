<style>
  :root {
    --bg0:#FBF8F3; --bg1:#F3EDE1; --ink:#141D16; --ink2:#46514A; --ink3:#79847C;
    --green:#2F6B4A; --green-deep:#1E4733; --green-soft:#7FC79B;
    --amber:#D89A5B; --amber-deep:#C97840;
    --brand:#1c7544; --hair:rgba(23,33,26,.1);
    --shadow:0 1px 2px rgba(23,33,26,.05), 0 12px 32px rgba(23,33,26,.09);
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Pretendard Variable", Pretendard, "Apple SD Gothic Neo",
    "Noto Sans KR", system-ui, sans-serif; background:var(--bg0); color:var(--ink);
    line-height:1.6; -webkit-font-smoothing:antialiased; }
  a { color:var(--green); }
  header { position:sticky; top:0; z-index:10; background:rgba(251,248,243,.92);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--hair); }
  .hwrap { max-width:1060px; margin:0 auto; padding:12px 18px;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo { font-weight:800; letter-spacing:-.02em; }
  .logo b { color:var(--brand); }
  .logo .tag { font-size:.72rem; font-weight:700; color:var(--amber-deep);
    border:1px solid var(--amber-deep); border-radius:999px; padding:1px 8px; margin-left:8px;
    vertical-align:2px; }
  .privacy { font-size:.74rem; color:var(--ink3); margin-left:auto; }
  nav.tabs { max-width:1060px; margin:0 auto; padding:0 12px; display:flex; gap:2px;
    overflow-x:auto; scrollbar-width:none; }
  nav.tabs::-webkit-scrollbar { display:none; }
  nav.tabs button { appearance:none; border:0; background:none; cursor:pointer;
    font:inherit; font-size:.86rem; font-weight:600; color:var(--ink2);
    padding:9px 12px; border-bottom:2px solid transparent; white-space:nowrap; }
  nav.tabs button.on { color:var(--green-deep); border-bottom-color:var(--brand); font-weight:800; }
  nav.tabs button .n { font-size:.7rem; color:var(--amber-deep); font-weight:800; margin-left:3px; }
  main { max-width:1060px; margin:0 auto; padding:20px 18px 80px; }
  .pane { display:none; }
  .pane.on { display:block; animation:fade .25s var(--ease); }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } }
  h2 { font-size:1.12rem; letter-spacing:-.01em; margin:4px 0 4px; }
  .sub { color:var(--ink3); font-size:.84rem; margin-bottom:16px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; }
  .card { background:#fff; border:1px solid var(--hair); border-radius:14px;
    padding:14px 16px; box-shadow:var(--shadow); }
  .card h3 { font-size:.95rem; display:flex; align-items:baseline; gap:8px; }
  .card h3 .rg { font-size:.72rem; color:var(--ink3); font-weight:600; }
  .big { font-size:1.5rem; font-weight:800; letter-spacing:-.02em; color:var(--green-deep); }
  .big small { font-size:.8rem; color:var(--ink3); font-weight:600; }
  .emo { color:var(--amber-deep); letter-spacing:1px; }
  .meter { height:6px; background:var(--bg1); border-radius:999px; overflow:hidden; margin:8px 0 4px; }
  .meter i { display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--green-soft)); border-radius:999px; transition:width .4s var(--ease); }
  .mut { color:var(--ink3); font-size:.76rem; }
  .sum { margin:0 0 14px; padding:12px 16px; background:var(--green-deep); color:#F6F4EC;
    border-radius:14px; display:flex; gap:22px; flex-wrap:wrap; align-items:baseline; }
  .sum b { font-size:1.25rem; }
  .sum span { font-size:.8rem; opacity:.85; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; background:#fff;
    border:1px solid var(--hair); border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--hair); vertical-align:top; }
  th { background:var(--bg1); font-size:.76rem; color:var(--ink2); }
  tr:last-child td { border-bottom:0; }
  .pill { display:inline-block; font-size:.7rem; font-weight:700; border-radius:999px;
    padding:1px 8px; background:var(--bg1); color:var(--ink2); }
  .pill.ok { background:#E3F0E8; color:var(--green-deep); }
  .pill.warn { background:#F6E8DC; color:var(--amber-deep); }
  .pill.bad { background:#F3DEDE; color:#8C3B3B; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  button.act { appearance:none; cursor:pointer; font:inherit; font-size:.84rem; font-weight:700;
    border-radius:10px; border:1px solid var(--hair); background:#fff; padding:8px 14px;
    transition:transform .15s var(--ease); }
  button.act:hover { transform:translateY(-1px); }
  button.act.pri { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.act.warn { color:#8C3B3B; }
  input[type=text], input[type=number], textarea, select {
    font:inherit; font-size:.86rem; border:1px solid var(--hair); border-radius:10px;
    padding:8px 10px; background:#fff; color:var(--ink); width:100%; }
  textarea { min-height:90px; resize:vertical; }
  label.f { display:block; font-size:.76rem; font-weight:700; color:var(--ink2); margin:8px 0 3px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:640px){ .grid2 { grid-template-columns:1fr; } }
  .panel { background:#fff; border:1px solid var(--hair); border-radius:14px; padding:16px; box-shadow:var(--shadow); margin-bottom:14px; }
  .log { font-size:.8rem; }
  .log li { list-style:none; padding:7px 0; border-bottom:1px dashed var(--hair); }
  .log .t { color:var(--ink3); font-size:.72rem; margin-right:8px; }
  pre.mailprev { white-space:pre-wrap; background:var(--bg1); border-radius:10px;
    padding:10px 12px; font:inherit; font-size:.8rem; margin-top:6px; }
  details summary { cursor:pointer; color:var(--green); font-size:.76rem; }
  .tipcard { border-left:4px solid var(--amber-deep); }
  .tipcard pre { white-space:pre-wrap; background:var(--bg1); border-radius:10px; padding:12px; font:inherit; font-size:.86rem; }
  footer { max-width:1060px; margin:30px auto 0; padding:14px 18px; color:var(--ink3);
    font-size:.78rem; border-top:1px solid var(--hair); }
  .empty { padding:26px; text-align:center; color:var(--ink3); background:#fff;
    border:1px dashed var(--hair); border-radius:14px; font-size:.86rem; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo"><b>un</b>plugin <span class="tag">OFFICE</span></div>
    <div class="privacy">데이터는 이 브라우저에만 저장됩니다 — 서버 전송 없음</div>
  </div>
  <nav class="tabs" id="tabs" aria-label="백오피스 탭"></nav>
</header>
<main id="main"></main>
<footer>
  Unplugin Office v1 — 코어(core/)와 같은 측정 규칙으로 동작하는 브라우저 백오피스.
  산정 근거: <code>ops/research-time-baselines.md</code> ·
  <a href="index.html">제품 소개로 돌아가기</a>
</footer>

<script src="office-data.js"></script>
<script>
/* ══════════ [OFFICE-PURE-BEGIN] 측정 엔진 — DOM·localStorage 무관 순수 블록.
   core(파이썬)의 classify/stress/dividend/tips/community 의미론을 그대로 포팅.
   검증: node tests/office_parity.js (파이썬 결과와 고객별 합계 완전 일치) ══════════ */
const OFFICE = (() => {
  // 파이썬 round()는 뱅커스 라운딩(동률 짝수) — Math.round(반올림)와 다르다.
  function pyRound(x) {
    const f = Math.floor(x), d = x - f;
    if (Math.abs(d - 0.5) < 1e-9) return f % 2 === 0 ? f : f + 1;
    return Math.round(x);
  }
  function clampFactor(f) {
    const n = parseFloat(f);
    if (!isFinite(n)) return 1.0;
    return Math.min(2.0, Math.max(0.5, n));
  }
  function emotionDots(load) {
    const n = Math.min(Math.max(Math.trunc(load), 0), 5);
    return "●".repeat(n) + "○".repeat(5 - n);
  }
  function gistOf(text) {  // 파이썬 " ".join(text.split())[:80]
    return (text || "").split(/\s+/).filter(Boolean).join(" ").slice(0, 80) || "이 일";
  }

  // ── 보고 판정 (core/dividend.is_report) ──
  function isReport(mail, C) {
    if ((mail.subject || "").includes(C.report_marker)) return true;
    if (mail.thread) return false;
    const low = (mail.body || "").toLowerCase();
    return C.done_words.some(w => low.includes(w));
  }

  // ── 분류 (core/classify.match — 일치 수 → status 랭크 → 특이도, 동점은 선순위 유지) ──
  function classifyMatch(text, D) {
    const low = (text || "").toLowerCase();
    let best = null, bestPl = null, bestScore = 0;
    for (const pl of D.catalog) {
      const trig = pl.triggers || [];
      let score = 0;
      for (const t of trig) if (low.includes(t.toLowerCase())) score++;
      if (!score) continue;
      const rank = [score, D.constants.status_rank[pl.status ?? "planned"] ?? 0, -trig.length];
      if (best === null || rank[0] > best[0]
          || (rank[0] === best[0] && (rank[1] > best[1]
          || (rank[1] === best[1] && rank[2] > best[2])))) {
        best = rank; bestPl = pl; bestScore = score;
      }
    }
    return bestPl ? { plugin: bestPl, score: bestScore } : null;
  }

  // ── 스트레스 (core/stress.detect — 복합구 최다 일치, 없으면 키워드 폴백 순서) ──
  function stressDetect(text, D) {
    const low = (text || "").toLowerCase();
    let best = null, bestScore = 0;
    for (const pb of D.playbooks) {
      let score = 0;
      for (const t of pb.triggers || []) if (low.includes(t.toLowerCase())) score++;
      if (score > bestScore) { best = pb; bestScore = score; }
    }
    if (best !== null) return best;
    const byId = Object.fromEntries(D.playbooks.map(pb => [pb.id, pb]));
    for (const [kw, pid] of D.keyword_fallback) if (low.includes(kw)) return byId[pid] || null;
    return null;
  }

  // ── 유형→기준치 (core/dividend._match_task) ──
  function matchTask(text, D) {
    const C = D.constants;
    const hit = classifyMatch(text, D);
    const pb = stressDetect(text, D);
    let task, pluginId, matched, minutes, emotion, evidence;
    if (hit) {
      const pl = hit.plugin;
      task = pl.name; pluginId = pl.id; matched = true;
      minutes = Math.trunc(pl.baseline_minutes ?? C.default_baseline);
      emotion = Math.trunc(pl.emotion_load ?? C.default_emotion);
      evidence = pl.evidence ?? C.default_evidence;
    } else {
      task = ""; pluginId = null; matched = false;
      minutes = C.default_baseline; emotion = C.default_emotion;
      evidence = C.default_evidence;
    }
    if (pb) {
      task = task || pb.name;
      pluginId = pluginId || ("stress:" + pb.id);
      minutes = Math.max(minutes, Math.trunc(pb.baseline_minutes ?? 90));
      emotion = Math.max(emotion, Math.trunc(pb.emotion_load ?? 4));
      evidence = pb.evidence ?? evidence;
    }
    return { task, plugin_id: pluginId, matched, saved_minutes: minutes,
             emotion_load: emotion, evidence };
  }

  // ── 팁 (core/tips.make_tip — 문구 동일) ──
  function makeTip(text, customer, D) {
    const C = D.constants;
    text = (text || "").trim();
    const addr = (customer && customer.address) || C.placeholder_addr;
    const reportLine = C.report_line.replace("{addr}", addr);
    const gist = gistOf(text);
    const hit = classifyMatch(text, D);
    const pb = stressDetect(text, D);
    const pl = hit ? hit.plugin : null;
    if (pb) {
      const minutes = Math.max(Math.trunc((pl || {}).baseline_minutes ?? 0),
                               Math.trunc(pb.baseline_minutes ?? 120));
      const emotion = Math.max(Math.trunc((pl || {}).emotion_load ?? 0),
                               Math.trunc(pb.emotion_load ?? 4));
      const prompt = `${gist} — ${pb.opener}. ` +
        "접수만 하고 끝내지 말고 실제 입금(결과) 확인까지 진행해줘. " +
        "상대가 회신하지 않으면 2회까지 재촉하고, 그래도 안 되면 " +
        `${pb.escalation} 단계로 넘어가 줘. ` +
        `진행 상황이 바뀔 때마다 알려줘. ${reportLine}`;
      return { task: pb.name, plugin_id: (pl || {}).id || ("stress:" + pb.id),
               matched: true, stress: true, saved_minutes_est: minutes,
               emotion_load: emotion, muze_prompt: prompt };
    }
    if (pl) {
      const prompt = `${gist} — 필요한 조건(예산·기한·선호)을 먼저 확인하고 진행해줘. ` +
        "결제나 확정이 필요한 지점에서는 진행 전에 물어봐줘. " + reportLine;
      return { task: pl.name, plugin_id: pl.id, matched: true, stress: false,
               saved_minutes_est: Math.trunc(pl.baseline_minutes ?? C.default_baseline),
               emotion_load: Math.trunc(pl.emotion_load ?? C.default_emotion),
               muze_prompt: prompt };
    }
    const prompt = `${gist} — 단계를 나눠 진행하고, 애매한 지점은 임의로 정하지 말고 ` +
      `물어봐줘. ${reportLine}`;
    return { task: gist, plugin_id: null, matched: false, stress: false,
             saved_minutes_est: C.default_baseline, emotion_load: C.default_emotion,
             muze_prompt: prompt };
  }
  function tipCardBody(card) {  // core/tips.card_body
    const lines = [
      "이 일은 직접 맡아드리는 대신, 쓰고 계신 AI 에이전트(Muze 등)에 이렇게 시켜보세요:",
      "", "┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄", card.muze_prompt, "┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄┄", "",
      `- 예상 절약: 약 ${card.saved_minutes_est}분 (직접 하실 때 기준)`,
      `- 아끼는 감정: ${emotionDots(card.emotion_load)}`,
    ];
    if (card.stress) lines.push(
      "- 이런 일은 '접수'가 아니라 '입금 확인'까지 시키는 게 핵심이에요 — 위 프롬프트에 그 지시가 들어 있어요.");
    lines.push("- 마지막 [보고] 한 줄은 꼭 그대로 두세요 — 보고 메일이 도착하는 순간 " +
      "절약 시간이 자동으로 적립됩니다. 직접 기록하실 건 없어요.");
    return lines.join("\n");
  }

  // ── 커뮤니티 (core/community — 고객당 상위 2유형, 같은 그룹+지역 ≥2) ──
  function groupOfEvent(ev, catMap, C) {
    const pid = ev.plugin || "";
    if (pid.startsWith("stress:")) return C.stress_group;
    return catMap[pid] || null;
  }
  function memberships(state, D) {
    const C = D.constants;
    const catMap = Object.fromEntries(D.catalog.map(pl => [pl.id, pl.category || ""]));
    const groups = new Map();
    for (const cid of Object.keys(state.ledgers).sort()) {
      const perCat = new Map();
      for (const e of state.ledgers[cid].events) {
        const g = groupOfEvent(e, catMap, C);
        if (!g) continue;
        if (!perCat.has(g)) perCat.set(g, { events: 0, minutes: 0 });
        const row = perCat.get(g);
        row.events++; row.minutes += e.saved_minutes;
      }
      const top = [...perCat.entries()].sort((a, b) => b[1].events - a[1].events).slice(0, 2);
      for (const [g, row] of top) {
        if (!groups.has(g)) groups.set(g, new Map());
        groups.get(g).set(cid, { customer: cid, ...row });
      }
    }
    const out = {};
    for (const [g, rows] of groups)
      out[g] = [...rows.values()].sort((a, b) => a.customer < b.customer ? -1 : 1);
    return out;
  }
  function nickname(state, cid, idx) {
    const prof = state.customers[cid] || {};
    return ((prof.name || cid)[0] || "?") + (idx + 1);
  }
  function regionsOf(state, members) {
    const by = {};
    for (const m of members) {
      const r = (state.customers[m.customer] || {}).region;
      if (r) (by[r] = by[r] || []).push(m.customer);
    }
    return by;
  }
  function meetupSection(state, cid, D) {
    const C = D.constants;
    const region = (state.customers[cid] || {}).region;
    if (!region) return "";
    const lines = [];
    const groups = memberships(state, D);
    for (const g of Object.keys(groups)) {
      const members = groups[g];
      const ids = members.map(m => m.customer);
      if (!ids.includes(cid)) continue;
      const same = regionsOf(state, members)[region] || [];
      if (!same.includes(cid) || same.length < C.min_group) continue;
      const others = same.length - 1;
      lines.push(`- **${D.group_names[g] || g}** — ${region}에 같은 일을 ` +
        `맡기는 이웃이 ${others}명 더 있어요. 이번 무브먼트, ` +
        "같이 움직여볼까요? 회신 주시면 자리를 만들어 드려요.");
    }
    if (!lines.length) return "";
    return "🧑‍🤝‍🧑 같은 그룹 모임 제안\n" + lines.join("\n");
  }
  function digestBody(state, D, g, members, weekMinutes) {
    const names = members.map((m, i) => nickname(state, m.customer, i)).join(", ");
    const h = Math.floor(weekMinutes / 60), mm = weekMinutes % 60;
    return [
      `'${D.group_names[g] || g}' 멤버가 ${members.length}명이 됐어요 (${names}).`,
      `그룹이 함께 벌어둔 시간: ${h}시간 ${mm}분.`, "",
      `이번 주 그룹 팁 — ${D.group_tips[g] || "팁 카드의 [보고] 한 줄을 잊지 마세요."}`, "",
      "같은 일을 맡기는 사람들이라 통하는 게 많아요. 나누고 싶은 팁이 있으면 " +
      "회신해 주세요 — 익명으로 다음 다이제스트에 실어 드려요.",
    ].join("\n");
  }
  function communityTick(state, D, nowMs, force) {
    const C = D.constants;
    const results = [], groups = memberships(state, D);
    state.community = state.community || { groups: {} };
    for (const g of Object.keys(groups)) {
      const members = groups[g];
      if (members.length < C.min_group) {
        results.push({ group: g, members: members.length, sent: false, detail: "인원 미달" });
        continue;
      }
      const last = (state.community.groups[g] || {}).last_digest;
      if (last && !force && nowMs - Date.parse(last) < C.digest_days * 86400e3) {
        results.push({ group: g, members: members.length, sent: false, detail: "주기 미도래" });
        continue;
      }
      const minutes = members.reduce((a, m) => a + m.minutes, 0);
      const body = digestBody(state, D, g, members, minutes);
      for (const m of members)
        results.push({ group: g, members: members.length, sent: true,
          mail: { to: m.customer, subject: `${D.group_names[g] || g} — 이번 주 다이제스트`, body } });
      state.community.groups[g] = { last_digest: new Date(nowMs).toISOString(), members: members.length };
    }
    return results;
  }

  // ── 적립 (core/dividend.accrue / _maybe_suggest) ──
  function emptyLedger(cid) {
    return { customer: cid,
      totals: { saved_minutes: 0, emotion_saved: 0, events_count: 0 },
      last_suggested_at_minutes: 0, events: [] };
  }
  function maybeSuggest(state, cid, D) {
    const C = D.constants;
    const prof = state.customers[cid] || {};
    const threshold = Math.trunc(prof.movement_threshold_minutes ?? C.default_threshold);
    const ledger = state.ledgers[cid];
    const total = ledger.totals.saved_minutes;
    if (Math.floor(total / threshold) <= Math.floor((ledger.last_suggested_at_minutes || 0) / threshold))
      return null;
    ledger.last_suggested_at_minutes = total;
    const h = Math.floor(total / 60), mm = total % 60;
    const lines = [`쌓인 시간 배당이 ${h}시간 ${mm}분이 됐어요. ` +
      "잔고에 잠들게 두지 말고, 다음 무브먼트에 투자해 보세요:\n"];

        <div class="sum"><div><b>${fmtHM(tot)}</b> <span>전체 적립</span></div>

    inbox() {

      return `<h2>수신함 — 보고·포워딩 처리</h2>

        [보고]/완료 키워드 → 적립 · 본인 포워딩 → 팁 카드 회신 · 미등록 발신 → 격리.</p>
        <div class="panel">
          <div class="row">

            <div><label class="f">to (전용주소)</label><input type="text" id="mTo" placeholder="jisoo.d3m0@unplugin.me"></div>
          </div>

          <label class="f">body</label><textarea id="mBody" placeholder="항공권 환불 처리했어. 입금까지 확인 완료."></textarea>

          <ul class="log">${S.log.slice(0, 40).map(l =>

             }">${esc(l.action)}</span> ${esc(l.detail)}${
             l.mailprev ? `<details><summary>발송 메일</summary><pre class="mailprev">${esc(l.mailprev)}</pre></details>` : ""
            }</li>`).join("") || "<li class='mut'>아직 처리한 메일이 없습니다.</li>"}

    feed() {

      if (!rows.length) return `<h2>적립 피드</h2><div class="empty">아직 적립이 없습니다 — 수신함에서 데모 메일을 처리해 보세요.</div>`;
      return `<h2>적립 피드</h2><p class="sub">이벤트마다 산정 근거(기준치 × 개인 보정, 출처)가 남습니다.</p>
        <table><tr><th>일시</th><th>고객</th><th>업무</th><th>절약</th><th>감정</th><th>발신 에이전트</th><th>산정 근거</th></tr>
        ${rows.slice(0, 80).map(e => `<tr>
          <td class="mut">${esc(String(e.date).slice(0, 10))}</td>

        `<option value="${cid}">${esc(S.customers[cid].name)} (${esc(S.customers[cid].address)})</option>`).join("");
      return `<h2>위임 팁 생성기</h2>
        <p class="sub">업무를 적으면 "에이전트에 이렇게 시키세요" 카드를 만듭니다 — 보고 한 줄 포함(실행되면 자동 적립).</p>

          <label class="f">고객 (전용주소 삽입)</label>

    /* ⑤ 커뮤니티 */
    community() {
      const groups = OFFICE.memberships(S, D);
      const keys = Object.keys(groups);
      const table = keys.length ? keys.sort((a, b) => groups[b].length - groups[a].length).map(g => {

        const rtxt = Object.keys(regions).sort().map(r => `${r} ${regions[r].length}명`).join(" · ") || "지역 미등록";
        const ok = members.length >= D.constants.min_group;
        return `<tr><td><b>${esc(D.group_names[g] || g)}</b><br><span class="mut">${esc(g)}</span></td>

            `${esc(OFFICE.nickname(S, m.customer, i))}(${esc(m.customer)}) ${m.minutes}분`).join("<br>")}</td></tr>`;
      }).join("") : "";
      const digests = S.community && S.community.groups ? Object.entries(S.community.groups) : [];
      return `<h2>커뮤니티 — 같은 일을 위임하는 사람들</h2>
        <p class="sub">적립 이력에서 자동 편성(고객당 상위 2유형). 같은 그룹 + 같은 지역 2인 이상이면 무브먼트 제안에 모임 섹션이 붙습니다.</p>

        ${keys.length ? `<table><tr><th>그룹</th><th>인원</th><th>지역</th><th>멤버(익명 닉네임)</th></tr>${table}</table>`
          : '<div class="empty">아직 그룹이 없습니다 — 적립이 쌓이면 자동 편성됩니다.</div>'}
        ${digests.length ? `<div class="panel" style="margin-top:14px"><h3 style="font-size:.9rem">다이제스트 발송 기록</h3>
          <ul class="log">${digests.map(([g, v]) =>
            `<li><span class="t">${esc(String(v.last_digest).slice(0, 19))}</span>${esc(D.group_names[g] || g)} — ${v.members}명</li>`).join("")}</ul></div>` : ""}`;
    },

    /* ⑥ 무브먼트 실험 — 오프라인 전환 메커니즘 10종, 대표 feasibility 평가용 */
    movement() {
      const M = S.movement;
      const groups = OFFICE.memberships(S, D);
      const custSel = id => `<select id="${id}">` + Object.keys(S.customers).sort().map(cid =>
        `<option value="${cid}">${esc(S.customers[cid].name)} (잔고 ${MOVEMENT.balanceOf(S, cid)}분)</option>`).join("") + `</select>`;
      const evalBox = id => {
        const ev = M.evals[id] || {};
        const btn = (v, lbl, cls) => `<button class="act ${ev.verdict === v ? cls : ""}"
          data-ev="${id}|${v}">${lbl}${ev.verdict === v ? " ✓" : ""}</button>`;
        return `<div class="row" style="margin-top:10px;border-top:1px dashed var(--hair);padding-top:10px">
          <span class="mut">대표 평가:</span>
          ${btn("go", "Go", "pri")}${btn("hold", "보류", "")}${btn("nogo", "No-go", "warn")}
          <input type="text" id="memo-${id}" placeholder="메모" value="${esc(ev.memo || "")}" style="flex:1;min-width:140px">
          <button class="act" data-evmemo="${id}">메모 저장</button>
          <a class="mut" href="https://github.com/kyj5482/unplugin/blob/main/ops/research-movement-ideas.md" target="_blank" rel="noopener" title="근거 문서 (GitHub)">근거: ops/research-movement-ideas.md#${id}</a>
        </div>`;
      };
      const card = (id, no, title, desc, metric, body) => `<div class="panel" id="mv-${id}">
        <h3 style="font-size:1rem">${no}. ${esc(title)} <span class="pill">${id}</span>
          ${M.evals[id] ? `<span class="pill ${M.evals[id].verdict === "go" ? "ok" : M.evals[id].verdict === "nogo" ? "bad" : "warn"}">${
            { go: "Go", hold: "보류", nogo: "No-go" }[M.evals[id].verdict]}</span>` : ""}</h3>
        <div class="sub" style="margin-bottom:8px">${desc}</div>
        <div class="mut" style="margin-bottom:8px">📊 ${metric}</div>
        ${body}${evalBox(id)}</div>`;

      // 요약판
      const verdicts = { go: 0, hold: 0, nogo: 0 };
      Object.values(M.evals).forEach(e => { if (verdicts[e.verdict] !== undefined) verdicts[e.verdict]++; });
      const evaluated = Object.keys(M.evals).length;
      const ls = MOVEMENT.lightningStats(M);
      const totalSpent = Object.values(S.ledgers).reduce((a, l) => a + (l.totals.spent_minutes || 0), 0);

      // 지표 계산
      const seasonsApplied = M.seasons.reduce((a, s) => a + s.applicants.length, 0);
      const seasonsCap = M.seasons.reduce((a, s) => a + s.capacity, 0);
      const seasonsRev = M.seasons.reduce((a, s) => a + MOVEMENT.seasonRevenue(s), 0);
      const vUsed = M.vouchers.filter(v => v.status === "사용").length;
      const stampsTotal = Object.values(M.stamps).reduce((a, x) => a + x.length, 0);
      const bestStreak = Math.max(0, ...M.challenges.flatMap(c =>
        Object.values(c.participants).map(MOVEMENT.streakOf)));
      const regions = [...new Set(Object.values(S.customers).map(p => p.region).filter(Boolean))];
      const covered = regions.filter(r => (D.local_courses[r] || []).length);

      return `<h2>무브먼트 실험 — 오프라인 전환 메커니즘 10종</h2>
        <p class="sub">커뮤니티 모임을 실제 오프라인 시간으로 바꾸는 장치들. 하나씩 실행해 보고
        Go/보류/No-go 를 평가하세요. 모든 동작·평가는 이 브라우저에만 저장됩니다.</p>
        <div class="sum"><div><b>${evaluated}/10</b> <span>평가 완료</span></div>
          <div><b>${verdicts.go}</b> <span>Go</span></div>
          <div><b>${verdicts.hold}</b> <span>보류</span></div>
          <div><b>${verdicts.nogo}</b> <span>No-go</span></div>
          <div><b>${fmtHM(totalSpent)}</b> <span>오프라인 전환 합계</span></div></div>

        ${card("time-lock", 1, "타임락 — 잔고를 캘린더에 박제", "잔고에서 N분을 골라 실제 .ics 일정 파일을 만들고 잔고에서 차감합니다. '시간이 있다'를 '시간을 잡았다'로.",

            <select id="tlWhen"><option value="weekend">다음 토요일 오전</option><option value="evening">내일 저녁 8시</option></select>
            <button class="act pri" id="tlGo">ICS 생성 + 차감</button></div>

        ${card("lightning", 2, "번개 — 같은 그룹·같은 동네 자동 매칭", "같은 일을 위임하는 같은 지역 이웃을 자동으로 묶어 번개를 제안하고, RSVP 2명이면 성사됩니다.",
          `제안 ${ls.proposed}건 · 성사 ${ls.done}건 · 성사율 ${ls.rate}%`,
          `<div class="row"><button class="act pri" id="ltGo">번개 제안 생성 (자동 매칭)</button></div>
          ${Object.values(M.lightning).map(p => `<div class="card" style="margin:8px 0">
            <b>${esc(D.group_names[p.group] || p.group)} · ${esc(p.region)}</b>

            <details><summary>초대 메일 미리보기</summary><pre class="mailprev">${esc(MOVEMENT.lightningInvite(p, D))}</pre></details>
            ${p.status === "성사" ? `<div class="row"><button class="act" data-ltlock="${esc(p.key)}">성사 ICS + 참석자 90분 차감 (타임락 연계)</button></div>` : ""}
          </div>`).join("") || '<div class="mut">아직 제안이 없습니다 — 생성 버튼을 누르세요.</div>'}`)}

        ${card("season", 3, "유료 시즌 모임 — 수익 모델 C 실증", "트레바리형: 4~8회차·10~25만 원 시즌 모임을 개설하고 신청·정원·대기열·예상 매출을 봅니다.",
          `시즌 ${M.seasons.length}개 · 신청 ${seasonsApplied}/${seasonsCap}명 · 예상 매출 ${seasonsRev.toLocaleString()}원`,
          `<div class="grid2"><div><label class="f">이름</label><input type="text" id="snName" value="환불 전사단 — 받아낸 돈으로 떠나는 시즌"></div>

              <input type="number" id="snRounds" value="4" min="4" max="8" style="width:64px">회차
              <input type="number" id="snPrice" value="150000" step="10000" style="width:110px">원

            <span class="pill">${s.rounds}회 · ${s.price.toLocaleString()}원 · 정원 ${s.capacity}</span>
            <div class="mut">확정 ${s.applicants.map(c => esc(S.customers[c]?.name || c)).join(", ") || "-"} ·

          `파트너 ${M.partners.length} · 발급 ${M.vouchers.length} · 사용 ${vUsed} · 수수료 누계 ${M.feeTotal.toLocaleString()}원`,
          `<div class="row"><input type="text" id="ptName" value="성수 가죽공방" style="width:150px">
            <input type="text" id="ptRegion" value="성수동" style="width:90px">

          <div class="mut">바우처 대상(잔고 ≥ 임계치): ${MOVEMENT.voucherEligible(S).map(c => esc(S.customers[c]?.name || c)).join(", ") || "없음 — 수신함에서 적립을 먼저"}</div>
          ${M.partners.length ? `<div class="row">${custSel("vcCust")}
            <select id="vcPartner">${M.partners.map(p => `<option value="${p.id}">${esc(p.name)} (${p.feePct}%)</option>`).join("")}</select>

          ${M.vouchers.map(v => `<div class="mut" style="padding:4px 0">🎟 ${v.id} — ${esc(S.customers[v.cid]?.name || v.cid)} →

        ${card("timebank", 5, "타임뱅크 — 그룹 품앗이 보드", "같은 그룹끼리 노하우를 교환합니다: '환불 노하우 알려드려요' ↔ '베이킹 기초 배우고 싶어요'.",
          `제공 ${M.timebank.offers.length} · 요청 ${M.timebank.requests.length} · 성사 ${M.timebank.matches.length}건`,

  /* ── 이벤트 바인딩 ── */
  function bind() {
    const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = fn; };
    on("#demoAll", () => {
      let n = 0;
      for (const m of D.demo_mails) {
        if (S.processed[m.id]) continue;
        processMail(m, m.id); S.processed[m.id] = true; n++;
      }
      pushLog("batch", `데모 일괄 처리 ${n}통 완료`);
      render();
    });
    on("#demoOne", () => {
      const m = D.demo_mails.find(x => !S.processed[x.id]);
      if (!m) { pushLog("batch", "남은 데모 메일 없음"); render(); return; }
      processMail(m, m.id); S.processed[m.id] = true; render();
    });
    on("#demoReset", () => { S.processed = {}; S.demoCursor = 0; pushLog("batch", "데모 진행 초기화"); render(); });
    on("#mSend", () => {
      const mail = { from: $("#mFrom").value, to: $("#mTo").value,
                     subject: $("#mSubj").value, body: $("#mBody").value };
      processMail(mail, "직접 투입"); render();
    });
    on("#tipMake", () => {
      const cid = $("#tipCustomer").value;
      const card = OFFICE.makeTip($("#tipText").value, cid ? S.customers[cid] : null, D);
      $("#tipOut").innerHTML = `<div class="panel tipcard">
        <h3 style="font-size:.95rem">${esc(card.task)}
          <span class="pill ${card.stress ? "warn" : card.matched ? "ok" : ""}">${
            card.stress ? "스트레스 — 고급 팁" : card.matched ? "유형 매칭" : "범용"}</span></h3>
        <div class="mut">예상 절약 약 ${card.saved_minutes_est}분 · 감정 <span class="emo">${OFFICE.emotionDots(card.emotion_load)}</span></div>
        <pre id="tipPrompt">${esc(card.muze_prompt)}</pre>
        <div class="row"><button class="act pri" id="tipCopy">프롬프트 복사</button>
        ${cid ? `<button class="act" id="tipSend" data-cid="${cid}">팁 카드 발송 기록</button>` : ""}</div></div>`;
      on("#tipCopy", () => {
        navigator.clipboard && navigator.clipboard.writeText(card.muze_prompt);
        $("#tipCopy").textContent = "복사됨 ✓";
      });
      on("#tipSend", () => {
        pushOutbox([{ to: cid, subject: `위임 팁: ${card.task} · 약 ${card.saved_minutes_est}분 절약`,
                      body: OFFICE.tipCardBody(card) }]);
        pushLog("tip_sent", `팁 생성기 발송 — ${card.task} (${S.customers[cid].name})`);
        render();
      });
    });
    on("#digestRun", () => runDigest(false));
    on("#digestForce", () => runDigest(true));
    function runDigest(force) {
      const rs = OFFICE.communityTick(S, D, Date.now(), force);
      const sent = rs.filter(r => r.sent);
      pushOutbox(sent.map(r => r.mail));
      const skipped = rs.filter(r => !r.sent).map(r => `${D.group_names[r.group] || r.group}(${r.detail})`);
      pushLog("digest", `다이제스트 ${sent.length}통 발송` + (skipped.length ? ` · 건너뜀: ${skipped.join(", ")}` : ""));
      render();
    }
    on("#obGo", () => {
      const name = $("#obName").value.trim();
      if (!name) { $("#obOut").textContent = "이름을 입력하세요"; return; }
      let id = OFFICE.slugId(name), n = 2;
      while (S.customers[id]) id = OFFICE.slugId(name) + n++;
      const suffix = Math.random().toString(36).slice(2, 6);
      S.customers[id] = {
        id, name, address: OFFICE.newAddress(id, suffix),
        contact: $("#obContact").value.trim(),
        region: $("#obRegion").value.trim() || undefined,
        time_factor: 1.0,
        movement_threshold_minutes: D.constants.default_threshold,
        trusted_senders: $("#obTrusted").value.split(",").map(s => s.trim()).filter(Boolean),
        onboarded: true,
      };
      pushLog("onboard", `온보딩 — ${name} → ${S.customers[id].address}`);
      render();
    });
    on("#calSave", () => {
      document.querySelectorAll("input[data-cal]").forEach(inp => {
        const cid = inp.dataset.cal;
        S.customers[cid].time_factor = OFFICE.clampFactor(inp.value);
      });
      pushLog("calibrate", "개인 보정 계수 저장 (0.5~2.0 클램프)");
      render();
    });
    on("#expBtn", () => { $("#dataIO").value = JSON.stringify(S, null, 2); });
    on("#impText", () => {
      try { const s = JSON.parse($("#dataIO").value); if (s && s.v === 1) { S = s; render(); } }
      catch (_) { alert("JSON 형식이 올바르지 않습니다."); }
    });
    const impFile = $("#impFile");
    if (impFile) impFile.onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { try { const s = JSON.parse(rd.result); if (s && s.v === 1) { S = s; render(); } } catch (_) {} };
      rd.readAsText(f);
    };
    on("#resetBtn", () => { S = seedState(); render(); });
    bindGrowth();
    bindMovement(on);
  }

  /* ── 성장 보드·장치 핸들러 ── */
  function bindGrowth() {
    document.querySelectorAll("[data-ops]").forEach(b =>
      b.onclick = () => { opsSub = b.dataset.ops; render(); });
    const slim = c => ({ id: c.id, mech: c.mech, kind: c.kind, minutes: c.minutes,
                         title: c.title, why: c.why || [] });
    document.querySelectorAll("[data-propose]").forEach(b => b.onclick = () => {
      const cid = b.dataset.propose;
      const rec = GROWTH.recommend(S, D, cid, OFFICE.memberships(S, D));
      if (!rec.primary) {
        pushLog("growth", `${S.customers[cid].name} — 제안 불가(잔고 ${rec.balance}분)`);
        render(); return;
      }
      (S.growth.proposals[cid] = S.growth.proposals[cid] || []).push({
        week: rec.week, t: nowIso(), primary: slim(rec.primary),
        alts: rec.alternatives.map(slim), mail: rec.mail, status: "제안" });
      pushLog("growth", `${S.customers[cid].name} ${rec.week}주차 제안 — ${rec.primary.title}`);
      render();
    });
    const lastProp = cid => { const a = S.growth.proposals[cid] || []; return a[a.length - 1]; };
    document.querySelectorAll("[data-gsend]").forEach(b => b.onclick = () => {
      const cid = b.dataset.gsend, pr = lastProp(cid);
      if (!pr) return;
      pr.status = "발송"; pushOutbox([pr.mail]);
      pushLog("growth", `제안 발송 — ${S.customers[cid].name}: ${pr.primary.title}`);
      render();
    });
    document.querySelectorAll("[data-gaccept]").forEach(b => b.onclick = () => {
      const pr = lastProp(b.dataset.gaccept);
      if (pr) { pr.status = "수락"; save(); render(); }
    });
    document.querySelectorAll("[data-gexec]").forEach(b => b.onclick = () => {
      const cid = b.dataset.gexec, pr = lastProp(cid);
      if (!pr) return;
      pr.status = "실행";
      MOVEMENT.stampAdd(S.movement, cid, "growth", pr.primary.title, MOVEMENT.isoDay(Date.now()));
      pushLog("growth", `실행 기록 🏅 — ${S.customers[cid].name}: ${pr.primary.title}`);
      render();
    });
  }

  /* ── 무브먼트 실험 핸들러 ── */
  function downloadICS(name, text) {
    const url = URL.createObjectURL(new Blob([text], { type: "text/calendar" }));
    const a = document.createElement("a");
    a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  function icsResultHtml(r, label) {
    return `<div class="card" style="margin-top:8px">✅ ${esc(label)} — 차감 후 잔고 ${r.balance}분
      <details open><summary>.ics 미리보기</summary><pre class="mailprev">${esc(r.ics)}</pre></details>
      <div class="row"><button class="act pri" data-icsdl>캘린더 파일(.ics) 다운로드</button></div></div>`;
  }
  function bindMovement(on) {
    if (cur !== "movement") return;
    const M = S.movement;
    const val = id => { const el = $("#" + id); return el ? el.value : ""; };
    let lastICS = null;

    on("#tlGo", () => {
      const cid = val("tlCust");
      const r = MOVEMENT.timeLock(S, M, cid, parseInt(val("tlMin"), 10), val("tlLabel"), Date.now(), val("tlWhen"));
      if (!r.ok) { $("#tlOut").innerHTML = `<div class="mut">⚠ ${esc(r.reason)}</div>`; return; }
      lastICS = { name: `unplugin-${cid}.ics`, text: r.ics };
      pushLog("movement", `time-lock — ${S.customers[cid].name} ${val("tlMin")}분 전환`);
      save();
      $("#tlOut").innerHTML = icsResultHtml(r, "타임락 생성");
      $("#tlOut [data-icsdl]").onclick = () => downloadICS(lastICS.name, lastICS.text);
    });

    on("#ltGo", () => {
      const created = MOVEMENT.lightningPropose(S, M, D, OFFICE.memberships(S, D), Date.now());
      pushLog("movement", `lightning — 제안 ${created.length}건 생성`);
      render();
    });
    document.querySelectorAll("[data-rsvp]").forEach(b => b.onclick = () => {
      const [key, cid, yes] = b.dataset.rsvp.split("|");
      MOVEMENT.lightningRsvp(M, key, cid, yes === "1");
      save(); render();
    });
    document.querySelectorAll("[data-ltlock]").forEach(b => b.onclick = () => {
      const p = M.lightning[b.dataset.ltlock];
      const yes = p.members.filter(c => p.rsvp[c] === true);
      let deducted = 0;
      for (const c of yes)
        if (MOVEMENT.spend(S, c, 90, `번개 — ${p.group} (${p.region})`, "lightning", Date.now()).ok) deducted++;
      const slot = p.slot;
      const ics = MOVEMENT.icsFile({ uid: `unplugin-lt-${Date.now()}@unplugin.me`,
        start: slot.start, end: slot.end, nowMs: Date.now(),
        summary: `번개 — ${D.group_names[p.group] || p.group} (${p.region})`,
        description: `참석 ${yes.length}명 · 장소 후보: ${p.places.join(" / ")}` });
      pushLog("movement", `lightning 성사 ICS — 참석 ${yes.length}명, 차감 ${deducted}명 × 90분`);
      downloadICS(`unplugin-lightning.ics`, ics);
      save(); render();
    });

    on("#snGo", () => {
      MOVEMENT.seasonCreate(M, { name: val("snName"), rounds: +val("snRounds"),
        price: +val("snPrice"), capacity: +val("snCap") });
      pushLog("movement", `season — 시즌 개설`);
      render();
    });
    document.querySelectorAll("[data-snapply]").forEach(b => b.onclick = () => {
      const sid = b.dataset.snapply;
      const r = MOVEMENT.seasonApply(M, sid, val("snApply-" + sid));
      pushLog("movement", `season 신청 — ${r.ok ? r.status : r.reason}`);
      render();
    });

    on("#ptAdd", () => {
      MOVEMENT.partnerAdd(M, { name: val("ptName"), region: val("ptRegion"),
        category: "공방", feePct: +val("ptFee") });
      render();
    });
    on("#vcIssue", () => {
      const r = MOVEMENT.voucherIssue(M, val("vcCust"), val("vcPartner"), Date.now());
      pushLog("movement", `voucher — ${r.ok ? "발급 " + r.voucher.id : r.reason}`);
      render();
    });
    document.querySelectorAll("[data-vuse]").forEach(b => b.onclick = () => {
      const vid = b.dataset.vuse;
      const r = MOVEMENT.voucherUse(M, vid, +val("amt-" + vid), Date.now());
      pushLog("movement", `voucher 사용 — ${r.ok ? "수수료 " + r.fee + "원 (누계 " + r.feeTotal + ")" : r.reason}`);
      render();
    });

    on("#tbOffer", () => { MOVEMENT.timebankPost(M, { cid: val("tbOfferCust"), kind: "offer", text: val("tbOfferText") }); render(); });
    on("#tbReq", () => { MOVEMENT.timebankPost(M, { cid: val("tbReqCust"), kind: "request", text: val("tbReqText") }); render(); });
    on("#tbMatch", () => {
      const r = MOVEMENT.timebankMatch(M, val("tbMo"), val("tbMr"), Date.now());
      pushLog("movement", `timebank — ${r.ok ? "매칭 " + r.match.id : r.reason}`);
      render();
    });

    on("#bdGo", () => {
      const created = MOVEMENT.buddyPair(M, OFFICE.memberships(S, D));
      pushLog("movement", `buddy — ${created.length}쌍 매칭`);
      render();
    });
    document.querySelectorAll("[data-bprom]").forEach(b => b.onclick = () => {
      const id = b.dataset.bprom;
      MOVEMENT.buddyPromise(M, id, val("bp-" + id), val("bpd-" + id));
      save(); render();
    });
    document.querySelectorAll("[data-bconf]").forEach(b => b.onclick = () => {
      const [id, cid] = b.dataset.bconf.split("|");
      MOVEMENT.buddyConfirm(M, id, cid, Date.now());
      save(); render();
    });

    on("#chGo", () => { MOVEMENT.challengeCreate(M, val("chTitle"), Date.now()); render(); });
    document.querySelectorAll("[data-chjoin]").forEach(b => b.onclick = () => {
      MOVEMENT.challengeJoin(M, b.dataset.chjoin, val("chJoin-" + b.dataset.chjoin));
      save(); render();
    });
    document.querySelectorAll("[data-chk]").forEach(b => b.onclick = () => {
      const [id, cid] = b.dataset.chk.split("|");
      const r = MOVEMENT.challengeCheckin(M, id, cid, MOVEMENT.isoDay(Date.now()));
      pushLog("movement", `challenge 인증 — ${r.ok ? "스트릭 " + r.streak + "일" : r.reason}`);
      render();
    });

    on("#lcGo", () => {
      const cid = val("lcCust");
      const { region, courses } = MOVEMENT.coursesFor(S, D, cid);
      $("#lcOut").innerHTML = courses.length ? courses.map(c =>
        `<div class="card" style="margin:8px 0"><b>${esc(c.title)}</b> <span class="pill">${esc(c.kind)} · ${c.duration_min}분</span>
         <div class="mut">${esc(c.desc)}</div>
         <div class="row"><button class="act" data-lclock="${esc(c.id)}|${c.duration_min}|${esc(c.title)}">이 코스로 타임락 (ICS+차감)</button></div></div>`).join("")
        : `<div class="mut">⚠ ${esc(region || "지역 미등록")} — 등록된 코스가 없어요.</div>`;
      document.querySelectorAll("[data-lclock]").forEach(b2 => b2.onclick = () => {
        const [, mins, title] = b2.dataset.lclock.split("|");
        const r = MOVEMENT.timeLock(S, M, cid, parseInt(mins, 10), title, Date.now());
        if (!r.ok) { alert(r.reason); return; }
        pushLog("movement", `local-course — ${title} 타임락`);
        downloadICS("unplugin-course.ics", r.ics);
        save(); render();
      });
    });

    on("#gtGo", () => {
      const cid = val("gtCust");
      const r = MOVEMENT.giftTime(S, M, cid, parseInt(val("gtMin"), 10), val("gtName") || "지인", Date.now(), val("gtWhen"));
      if (!r.ok) { $("#gtOut").innerHTML = `<div class="mut">⚠ ${esc(r.reason)}</div>`; return; }
      pushLog("movement", `gift-time — ${S.customers[cid].name} → ${val("gtName")} ${val("gtMin")}분`);
      save();
      $("#gtOut").innerHTML = `<div class="card" style="margin-top:8px">💌
        <pre class="mailprev">${esc(r.invite)}</pre>${icsResultHtml(r, "초대장 생성")}</div>`;
      $("#gtOut [data-icsdl]").onclick = () => downloadICS("unplugin-gift.ics", r.ics);
    });

    // 평가 — Go/보류/No-go + 메모 (localStorage 저장)
    document.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => {
      const [id, v] = b.dataset.ev.split("|");
      M.evals[id] = Object.assign({}, M.evals[id], { verdict: v, t: nowIso() });
      save(); render();
    });
    document.querySelectorAll("[data-evmemo]").forEach(b => b.onclick = () => {
      const id = b.dataset.evmemo;
      M.evals[id] = Object.assign({ verdict: "hold" }, M.evals[id],
        { memo: $("#memo-" + id).value, t: nowIso() });
      save(); render();
    });
  }

  render();
})();
</script>
</body>
</html>
